        <ul class="flex gap-14 text-gray-400 hidden md:flex" style="font-size: large;">

            <li class="hover:underline">

            </li>

        <div class="flex items-center gap-6 text-gray-400 text-xl m-4 md:gap-10">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5"

                stroke="currentColor" class="w-5 h-5 cursor-pointer">
                <path stroke-linecap="round" stroke-linejoin="round"
                    d="M15.75 10.5V6a3.75 3.75 0 1 0-7.5 0v4.5m11.356-1.993 1.263 12c.07.665-.45 1.243-1.119 1.243H4.25a1.125 1.125 0 0 1-1.12-1.243l1.264-12A1.125 1.125 0 0 1 5.513 7.5h12.974c.576 0 1.059.435 1.119 1.007ZM8.625 10.5a.375.375 0 1 1-.75 0 .375.375 0 0 1 .75 0Zm7.5 0a.375.375 0 1 1-.75 0 .375.375 0 0 1 .75 0Z" />

            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" fill="currentColor"

                    clip-rule="evenodd" />
            </svg>
        </div>
    </nav>

    <!--contactpage-->
    <section class="mt-5" style="color: #C6C8C5;">
        <div class="grid lg:grid-cols-3 justify-center items-center gap-y-8">
           <div class="lg:col-span-2 p-6 w-full max-w-2xl mx-auto lg:p-8">
              <div class="mb-12">
                 <h2 class="text-3xl font-bold text-slate-900 mb-6 md:text-4xl dark:text-slate-50">
                    Contact us
                 </h2>
                 <p class="text-base leading-relaxed text-slate-600 dark:text-slate-400">
                    Have a question, need support, or want to discuss in choosing the right plant for you? We’re here to help.
                 </p>
              </div>
     
              <form class="grid gap-4 sm:grid-cols-2">
                 <div>
                    <label for="name"
                       class="mb-2 text-slate-900 dark:text-slate-50 font-medium text-sm inline-block">Name</label>
                    <input type="text" id="name" name="name" placeholder="John doe"
                       class="px-3 py-2.5 text-sm text-slate-900 w-full rounded-md outline-1 -outline-offset-1 outline-slate-300 focus:outline-2 focus:-outline-offset-2 focus:outline-blue-600 dark:text-slate-50 dark:bg-neutral-800 dark:outline-neutral-700" style="background-color: #C6C8C5;" />
                 </div>
                 <div>
                    <label for="email"
                       class="mb-2 text-slate-900 dark:text-slate-50 font-medium text-sm inline-block">Email</label>
                    <input type="email" id="email" name="email" placeholder="john@readymadeui.com"
                       class="px-3 py-2.5 text-sm text-slate-900 w-full rounded-md  outline-1 -outline-offset-1 outline-slate-300 focus:outline-2 focus:-outline-offset-2 focus:outline-blue-600 dark:text-slate-50 dark:bg-neutral-800 dark:outline-neutral-700" style="background-color: #C6C8C5;"/>
                 </div>
                 <div>
                    <label for="phone" class="mb-2 text-slate-900 dark:text-slate-50 font-medium text-sm inline-block">Phone
                       number</label>
                    <input type="number" id="phone" name="phone" placeholder="+11800-259-854"
                       class="px-3 py-2.5 text-sm text-slate-900 w-full rounded-md  outline-1 -outline-offset-1 outline-slate-300 focus:outline-2 focus:-outline-offset-2 focus:outline-blue-600 dark:text-slate-50 dark:bg-neutral-800 dark:outline-neutral-700" style="background-color: #C6C8C5;"/>
                 </div>
                 <div>
                    <label for="company"
                       class="mb-2 text-slate-900 dark:text-slate-50 font-medium text-sm inline-block">Company</label>
                    <input type="text" id="company" name="company" placeholder="XYZ pvt. ltd."
                       class="px-3 py-2.5 text-sm text-slate-900 w-full rounded-md  outline-1 -outline-offset-1 outline-slate-300 focus:outline-2 focus:-outline-offset-2 focus:outline-blue-600 dark:text-slate-50 dark:bg-neutral-800 dark:outline-neutral-700" style="background-color: #C6C8C5;"/>
                 </div>
                 <div class="col-span-full">
                    <div>
                       <label for="message"
                          class="mb-2 text-slate-900 dark:text-slate-50 font-medium text-sm inline-block">Message</label>
                       <textarea placeholder="Write message" rows="6" type="text" id="message" name="message"
                          class="px-3 py-2.5 text-sm text-slate-900 w-full rounded-md  outline-1 -outline-offset-1 outline-slate-300 focus:outline-2 focus:-outline-offset-2 focus:outline-blue-600 dark:text-slate-50 dark:bg-neutral-800 dark:outline-neutral-700" style="background-color: #C6C8C5;"></textarea>
                    </div>
                    <button type="submit"
                       class="mt-6 w-full py-2.5 px-4 text-sm rounded-md font-semibold cursor-pointer text-white border border-blue-600 bg-blue-600 hover:bg-blue-700 transition-all focus:outline-none focus-visible:ring-2 focus-visible:ring-blue-500 style="background-color: #C6C8C5;"">Send
                       message</button>
                 </div>
              </form>
           </div>
     
           <div class="relative -order-1 lg:order-1 lg:h-screen mr-5">
              <img src="./images/main.png" alt="contact us image"
                 class="w-full h-full object-cover object-top lg:absolute lg:right-0 lg:top-0 lg:bottom-0" />
           </div>
        </div>
     </section>

    <!--footer section-->
    <section class="p-10 flex flex-col justify-center gap-6 mt-7 border-t-2 border-t-white"
        style="color: #C6C8C5; background-color: #192216;">
        <div class="flex gap-1 items-center">
            <img src="./images/logo.png" class="w-8 h-8">
            <h1 class="font-medium text-xl">Plantoria</h1>
        </div>
        <p>Lorem, ipsum dolor sit amet consectetur adipisicing elit. Harum, consequatur?</p>
        <p>@2026 Plantoria.com</p>
    </section>
</body>

</html>
